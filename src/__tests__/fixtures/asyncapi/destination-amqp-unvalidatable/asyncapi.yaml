asyncapi: "3.0.0"
info:
  title: Event Service
  version: "1.0.0"
servers:
  broker:
    host: broker.example.com
    protocol: amqp
channels:
  events:
    address: "audit.events.#"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: events
          type: topic
    messages:
      Event:
        payload:
          type: object
          properties:
            id:
              type: string
          required:
            - id
operations:
  sendEvent:
    action: send
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/Event"
