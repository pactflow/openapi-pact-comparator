asyncapi: "3.0.0"
info:
  title: Counter Service
  version: "1.0.0"
components:
  messages:
    Counter:
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          type: record
          name: Counter
          fields:
            - name: count
              type: long
channels:
  main:
    address: main
    messages:
      Counter:
        $ref: "#/components/messages/Counter"
operations:
  receiveCounter:
    action: receive
    channel:
      $ref: "#/channels/main"
    messages:
      - $ref: "#/channels/main/messages/Counter"
