asyncapi: "3.0.0"
info:
  title: Stock Service
  version: "1.0.0"
components:
  schemas:
    StockUpdated:
      type: object
      properties:
        ticker:
          type: string
        price:
          type: number
      required:
        - ticker
        - price
  messages:
    StockUpdated:
      contentType: application/json
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "#/components/schemas/StockUpdated"
channels:
  stockUpdates:
    address: stock-updates
    messages:
      StockUpdated:
        $ref: "#/components/messages/StockUpdated"
operations:
  receiveStockUpdates:
    action: receive
    channel:
      $ref: "#/channels/stockUpdates"
    messages:
      - $ref: "#/channels/stockUpdates/messages/StockUpdated"
