asyncapi: "3.0.0"
info:
  title: User Service
  version: "1.0.0"
components:
  messages:
    UserSignedUp:
      contentType: avro/binary
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          type: record
          name: UserSignedUp
          namespace: com.example
          fields:
            - name: userId
              type: string
            - name: age
              type: int
            - name: email
              type: ["null", "string"]
              default: null
            - name: plan
              type:
                type: enum
                name: Plan
                symbols: [FREE, PRO]
channels:
  userSignups:
    address: user-signups
    messages:
      UserSignedUp:
        $ref: "#/components/messages/UserSignedUp"
operations:
  receiveUserSignedUp:
    action: receive
    channel:
      $ref: "#/channels/userSignups"
    messages:
      - $ref: "#/channels/userSignups/messages/UserSignedUp"
