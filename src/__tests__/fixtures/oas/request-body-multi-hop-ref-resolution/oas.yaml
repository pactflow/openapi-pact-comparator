openapi: 3.0.0
info:
  title: OAS
  version: 1.0.0

paths:
  /users:
    post:
      requestBody:
        $ref: "#/components/requestBodies/CreateUserAlias"
      responses:
        "201":
          description: Created

components:
  requestBodies:
    CreateUserAlias:
      $ref: "#/components/requestBodies/CreateUser"
    CreateUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
            required:
              - username
