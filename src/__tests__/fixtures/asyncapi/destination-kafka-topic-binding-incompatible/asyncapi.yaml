asyncapi: "3.0.0"
info:
  title: Event Service
  version: "1.0.0"
servers:
  broker:
    host: broker.example.com
    protocol: kafka
channels:
  events:
    address: orderEvents
    bindings:
      kafka:
        topic: orders.created
    messages:
      Event:
        payload:
          type: object
          properties:
            id:
              type: string
          required:
            - id
operations:
  sendEvent:
    action: send
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/Event"
