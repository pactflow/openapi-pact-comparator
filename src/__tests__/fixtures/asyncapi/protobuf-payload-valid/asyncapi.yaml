asyncapi: "3.0.0"
info:
  title: Order Service
  version: "1.0.0"
components:
  messages:
    OrderPlaced:
      contentType: application/protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema: |
          syntax = "proto3";
          package shop;

          message OrderPlaced {
            string order_id = 1;
            int32 quantity = 2;
            repeated string tags = 3;
          }

          message OrderCancelled {
            string order_id = 1;
          }

channels:
  orders:
    address: orders
    messages:
      OrderPlaced:
        $ref: "#/components/messages/OrderPlaced"
operations:
  receiveOrderPlaced:
    action: receive
    channel:
      $ref: "#/channels/orders"
    messages:
      - $ref: "#/channels/orders/messages/OrderPlaced"
